  postgres_db:
      image: postgres
      command: -p 5434
      restart: always
      expose:
        - 5434
      ports:
        - "5434:5434"
      env_file:
        - .env
      volumes:
        - postgres_data:/var/lib/postgresql/data
  redis_db:
      image: redis
      restart: always
      expose:
        - 6380
      ports:
        - "6380:6380"
      volumes:
        - redis_data:/data
      entrypoint: redis-server --appendonly yes --port 6380
volumes:
  postgres_data:
  redis_data:

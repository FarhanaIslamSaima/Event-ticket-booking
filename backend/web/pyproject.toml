[project]
name = "web"
version = "0.1.0"
description = "Your web project description"

requires-python = ">=3.10"
dependencies = [
    "asgiref>=3.8.1",
    "attrs>=25.3.0",
    "certifi>=2025.4.26",
    "charset-normalizer>=3.4.2",
    "click>=8.2.1",
    "colorama>=0.4.6",
    "dj-rest-auth>=7.0.1",
    "Django>=5.2.1",
    "django-allauth>=65.8.1",
    "django-cors-headers>=4.7.0",
    "django-filter>=25.1",
    "djangorestframework>=3.16.0",
    "drf-spectacular>=0.28.0",
    "gunicorn>=23.0.0",
    "psycopg>=3.2.9",
    "psycopg-binary>=3.2.9",
    "python-dotenv>=1.1.0",
    "requests>=2.32.3",
    "sqlparse>=0.5.3",
    "tzdata>=2025.2",
    "uritemplate>=4.1.1",
    "urllib3>=2.4.0",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "flake8>=7.2.0",
    "isort>=6.0.1",
    "mypy>=1.15.0",
    "pytest>=8.3.5",
    "pytest-django>=4.11.1",
    "pre-commit>=4.2.0",
    "mypy_extensions>=1.1.0",
    "pycodestyle>=2.13.0",
    "pyflakes>=3.3.2",
    "identify>=2.6.10",
    "iniconfig>=2.1.0",
    "pathspec>=0.12.1",
    "platformdirs>=4.3.8",
    "pluggy>=1.6.0",
    "filelock>=3.18.0",
    "virtualenv>=20.31.2",
    "jsonschema>=4.23.0",
    "jsonschema-specifications>=2025.4.1",
    "referencing>=0.36.2",
    "rpds-py>=0.25.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
sources = ["src"]

[tool.hatch.build.targets.wheel]
packages = ["src/project"]

[tool.ruff]
exclude = ["migrations", "tests", ".venv", ".git", ".vscode", ".idea", "__pycache__", ".pytest_cache", ".mypy_cache"]
line-length = 119

[tool.ruff.lint]
extend-select = ["E501", "F", "E", "W", "N", "I"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "project.settings.test"
django_find_project = true
python_files = ["test_*.py", "*_tests.py", "tests.py"]
testpaths = ["tests", "web"]
addopts = "--reuse-db --tb=short --capture=no --cov=web --cov-report=xml --cov-config=.coveragerc"
